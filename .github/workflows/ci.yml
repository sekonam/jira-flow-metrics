name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: format · typecheck · lint · preflight · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # No `version:` input on purpose. pnpm/action-setup reads the
      # `packageManager` field from package.json, and supplying both is an
      # error when they could disagree. One source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm run format:check

      # Typecheck before lint, not after. `tsc --build` is what emits the
      # `.d.ts` files for the workspace packages, and ESLint's type-aware rules
      # resolve `@jfm/*` through those files. Run the other way round on a
      # clean checkout — which is exactly what CI is — every cross-package
      # import is an unresolved `any` and ESLint reports about a thousand
      # `no-unsafe-*` errors that say nothing about the code.
      - name: Typecheck
        run: pnpm run typecheck

      - name: ESLint
        run: pnpm run lint

      # ★ Preflight runs here too, not only in `pnpm run verify`.
      #
      # It is the only check in the repo that reads the five manifests
      # against the code beside them — in particular the @forge/events
      # consumer shape, which deploys and lints clean in its legacy form and
      # then never fires. `test/manifests.test.ts` covers the rest of the
      # manifest claims, so leaving this out of CI left exactly one gap, and
      # it was the expensive one.
      - name: Preflight
        run: pnpm run preflight

      # Coverage thresholds are configured in vitest.config.ts (80% on
      # packages/engine). Vitest exits non-zero when a threshold is missed, so
      # this step is the coverage gate.
      - name: Tests + coverage gate
        run: pnpm run coverage

      - name: Build
        run: pnpm run build

  browser:
    name: browser flows · screenshots · accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # No `version:` input on purpose — see the verify job.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Chromium only: both scripts launch `chromium` explicitly, and the
      # other two engines are a two-minute download for nothing.
      - name: Install Chromium
        run: pnpm --filter @jfm/ui-harness exec playwright install --with-deps chromium

      # ★ These two carry checks that exist nowhere else, and until now ran
      # only when somebody remembered to type them.
      #
      # `e2e:ui` drives all five listings through a real browser against
      # real resolvers — the only place a click reaches a handler. And
      # `ui:screens` runs axe over every surface in real Chromium, which is
      # where `color-contrast` is actually meaningful, and fails when two
      # scenarios render the same text on one screen: three separate rounds
      # of review found screenshots published under captions their own image
      # contradicted, and that check is what makes the next one impossible
      # rather than merely unlikely.
      - name: Browser flows
        run: pnpm run e2e:ui

      - name: Screenshots and accessibility
        run: pnpm run ui:screens

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # No `version:` input on purpose. pnpm/action-setup reads the
      # `packageManager` field from package.json, and supplying both is an
      # error when they could disagree. One source of truth.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Two gates with different thresholds, because they cover different risk.
      # Production dependencies are what ends up in the Forge bundle a customer
      # runs, so they are held to `moderate`. The dev tree (vitest, the Forge
      # CLI's tunnel server) never ships, so it is held to `high`.
      - name: pnpm audit — production dependencies (moderate and above)
        run: pnpm audit --prod --audit-level moderate

      - name: pnpm audit — whole tree (high and above)
        run: pnpm audit --audit-level high
