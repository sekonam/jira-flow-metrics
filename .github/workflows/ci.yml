name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: format · lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # No `version:` input on purpose. pnpm/action-setup reads the
      # `packageManager` field from package.json, and supplying both is an
      # error when they could disagree. One source of truth.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm run format:check

      - name: ESLint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # Coverage thresholds are configured in vitest.config.ts (80% on
      # packages/engine). Vitest exits non-zero when a threshold is missed, so
      # this step is the coverage gate.
      - name: Tests + coverage gate
        run: pnpm run coverage

      - name: Build
        run: pnpm run build

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # No `version:` input on purpose. pnpm/action-setup reads the
      # `packageManager` field from package.json, and supplying both is an
      # error when they could disagree. One source of truth.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Two gates with different thresholds, because they cover different risk.
      # Production dependencies are what ends up in the Forge bundle a customer
      # runs, so they are held to `moderate`. The dev tree (vitest, the Forge
      # CLI's tunnel server) never ships, so it is held to `high`.
      - name: pnpm audit — production dependencies (moderate and above)
        run: pnpm audit --prod --audit-level moderate

      - name: pnpm audit — whole tree (high and above)
        run: pnpm audit --audit-level high
