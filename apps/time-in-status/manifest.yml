# ✔ VALIDATED — `forge lint` reports "No issues found" for this manifest, as of
# 2026-09-10, against the app id below registered in the "AskMe Solutions"
# Developer Space. It took two fixes to get there, both of which the published
# module reference did not make obvious: the `sql` module (the code uses Forge
# SQL and nothing declared it) and the gadget `thumbnail`.
#
# ✔ DEPLOYED — version 2.0.0 is live in the `development` environment and
# installed on sergiip180.atlassian.net. Getting there needed one more fix that
# no local check caught: `import ... from './runtime.js'` typechecks and builds
# but cannot be bundled, because Forge's webpack resolves the specifier
# literally and there is no `runtime.js` on disk. Atlassian reports the build
# eligible for Runs on Atlassian — the app makes no external egress.

modules:
  jira:projectPage:
    - key: time-in-status-page
      resource: main
      render: native
      resolver:
        function: resolver
      title: Time in Status

  jira:dashboardGadget:
    - key: time-in-status-gadget
      resource: gadget
      render: native
      resolver:
        function: resolver
      # Lets the gadget owner pick a project — a jira:dashboardGadget context
      # carries no project of its own, confirmed live 2026-09-11 (every
      # gadget refused with "This report can only be opened from inside a
      # Jira project" until this existed, with no way to fix it from the
      # dashboard). Reuses the same resource: gadget.tsx checks
      # `context.extension.entryPoint` and renders the picker instead of the
      # report. Exact shape unverified against Forge's manifest schema until
      # `forge lint` runs.
      edit:
        resource: gadget
      title: Time in Status
      description: Cumulative time each issue has spent in every status, including
        re-entries.
      # Required by the gadget schema, and must be a real, absolute, publicly
      # reachable HTTPS URL, confirmed to 255 characters max — both facts came
      # from testing against the live account, not the docs (which only say
      # "absolute URL"; the length cap surfaced as a real deploy rejection when
      # a data: URI was tried as a way to avoid external hosting entirely).
      # Source file: assets/thumbnails/time-in-status.png, generated by
      # packages/ui-harness/scripts/render-thumbnails.mjs. Hosted at
      # github.com/sekonam/jira-flow-metrics-assets — a separate public repo
      # holding only these five icons, so the private source repo stays private.
      thumbnail: https://raw.githubusercontent.com/sekonam/jira-flow-metrics-assets/main/time-in-status.png

  function:
    - key: resolver
      handler: index.handler
    - key: issue-event-handler
      handler: index.onIssueEvent
    - key: backfill-consumer
      handler: index.backfillHandler

  trigger:
    - key: issue-events
      function: issue-event-handler
      events:
        # Incremental ingestion only. There is deliberately NO scheduled
        # trigger anywhere in this app: Forge is consumption-priced, so a
        # periodic re-index would make the marginal cost of an install grow
        # with the customer's instance size while the price stays flat.
        - avi:jira:created:issue
        - avi:jira:updated:issue
        - avi:jira:deleted:issue

  # `forge lint` rejects the app without this: src/runtime.ts uses the Forge
  # SQL package, and a manifest that does not declare the module fails
  # validation before it ever reaches a tenant.
  sql:
    - key: db
      engine: mysql

  # `function: backfill-consumer` directly, not `resolver: {function, method}`.
  # The nested-resolver form is what @forge/events v1.x wanted; v3 (the
  # version actually installed here) wants a plain function taking the raw
  # queue payload. The legacy form still deploys and lints clean — confirmed
  # live: the consumer simply never fired, and a real backfill sat at "0
  # issues indexed" forever with nothing in forge logs, since the function
  # was never invoked at all.
  consumer:
    - key: backfill-queue-consumer
      queue: backfill
      function: backfill-consumer

resources:
  - key: main
    path: src/frontend/index.tsx
  - key: gadget
    path: src/frontend/gadget.tsx

app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/05b589b7-c96b-40eb-8ded-0cc100ef851b

permissions:
  scopes:
    # Least privilege; the app never writes to Jira.
    # read:jira-work — issues, changelogs and worklogs
    # read:jira-user — display names shown on reports
    # storage:app    — Forge SQL tables and app settings
    - read:jira-work
    - read:jira-user
    - storage:app
