# ✔ VALIDATED — `forge lint` reports "No issues found" for this manifest, as of
# 2026-09-10, against the app id below registered in the "AskMe Solutions"
# Developer Space. It took two fixes to get there, both of which the published
# module reference did not make obvious: the `sql` module (the code uses Forge
# SQL and nothing declared it) and the gadget `thumbnail`.
#
# ✔ DEPLOYED — version 2.0.0 is live in the `development` environment and
# installed on sergiip180.atlassian.net. Getting there needed one more fix that
# no local check caught: `import ... from './runtime.js'` typechecks and builds
# but cannot be bundled, because Forge's webpack resolves the specifier
# literally and there is no `runtime.js` on disk. Atlassian reports the build
# eligible for Runs on Atlassian — the app makes no external egress.

modules:
  jira:projectPage:
    - key: time-in-status-page
      resource: main
      render: native
      resolver:
        function: resolver
      title: Time in Status

  # The admin usage page — TECHNICAL-SPEC § 11 item 10. `storageEstimate()`
  # has existed since the first commit with nothing exposing it, because its
  # figures are instance-wide and no project-scoped surface can authorise an
  # instance-wide question. `jira:adminPage` is the surface that can: Jira
  # restricts it to administrators itself.
  jira:adminPage:
    - key: time-in-status-admin
      resource: admin
      render: native
      resolver:
        function: resolver
      title: Time in Status storage

  # One issue's timeline — ROADMAP stage 5. It renders as a tab *inside* the
  # Activity panel, next to Comments and History, which is the strongest
  # place this product's argument can be made: the cumulative figure sits one
  # click from the transitions it is derived from.
  #
  # ⚠️ `jira:issuePanel` was tried first and deployed and linted cleanly and
  # never appeared. Two documented reasons, both disqualifying, and neither
  # visible from the manifest:
  #
  #   1. An issue panel is **opt-in per issue**. The module contributes a
  #      button under "Apps" below the summary; the panel exists on an issue
  #      only after somebody clicks it, and Atlassian confirms there is no
  #      way to open one automatically (FRGE-734, ECO-251 — still open).
  #   2. "Only users with permission to edit the Jira issue can see the
  #      configured button." The people who read reports are routinely the
  #      people without edit permission, so the surface would have been
  #      invisible to its own audience.
  #
  # `jira:issueActivity` has neither property: the tab is always present, for
  # every viewer, with no per-issue opt-in. It also takes no `icon` — the
  # property does not exist on this module.
  jira:issueActivity:
    - key: time-in-status-activity
      resource: panel
      render: native
      resolver:
        function: resolver
      title: Time in Status

  jira:dashboardGadget:
    - key: time-in-status-gadget
      resource: gadget
      render: native
      resolver:
        function: resolver
      # Lets the gadget owner pick a project — a jira:dashboardGadget context
      # carries no project of its own, confirmed live 2026-09-11 (every
      # gadget refused with "This report can only be opened from inside a
      # Jira project" until this existed, with no way to fix it from the
      # dashboard). Reuses the same resource: gadget.tsx checks
      # `context.extension.entryPoint` and renders the picker instead of the
      # report.
      #
      # `render: native` is required here too, not just at the module's top
      # level — without it Jira's own "Configure" menu item on the gadget
      # renders permanently disabled, confirmed live 2026-09-15 on both the
      # admin system-default dashboard and a fresh personal one. Atlassian's
      # manifest reference lists `edit.render: 'native'` as valid but never
      # states it is required for the menu item to be clickable.
      edit:
        resource: gadget
        render: native
      title: Time in Status
      description: Cumulative time each issue has spent in every status, including
        re-entries.
      # Required by the gadget schema, and must be a real, absolute, publicly
      # reachable HTTPS URL, confirmed to 255 characters max — both facts came
      # from testing against the live account, not the docs (which only say
      # "absolute URL"; the length cap surfaced as a real deploy rejection when
      # a data: URI was tried as a way to avoid external hosting entirely).
      # Source file: assets/thumbnails/time-in-status.png, generated by
      # packages/ui-harness/scripts/render-thumbnails.mjs. Hosted at
      # github.com/sekonam/jira-flow-metrics-assets — a separate public repo
      # holding only these five icons, so the private source repo stays private.
      thumbnail: https://raw.githubusercontent.com/sekonam/jira-flow-metrics-assets/main/time-in-status.png

  function:
    - key: resolver
      handler: index.handler
    - key: issue-event-handler
      handler: index.onIssueEvent
    - key: backfill-consumer
      handler: index.backfillHandler
      # Async-events consumer functions default to a 55s timeout; the manifest
      # schema allows up to 900s via `timeoutSeconds` (developer.atlassian.com
      # /platform/forge/manifest-reference/modules/function/, checked
      # 2026-09-15). Forge bills by actual runtime, not the declared ceiling,
      # so opting into the max costs nothing when a slice finishes early — it
      # only matters on the slices that would otherwise be killed mid-page.
      # `timeBudgetMs` in packages/engine/src/ingest/backfill.ts is set to 70%
      # of this value; the two must move together.
      timeoutSeconds: 900

  trigger:
    - key: issue-events
      function: issue-event-handler
      events:
        # Incremental ingestion only. There is deliberately NO scheduled
        # trigger anywhere in this app: Forge is consumption-priced, so a
        # periodic re-index would make the marginal cost of an install grow
        # with the customer's instance size while the price stays flat.
        - avi:jira:created:issue
        - avi:jira:updated:issue
        - avi:jira:deleted:issue

  # `forge lint` rejects the app without this: src/runtime.ts uses the Forge
  # SQL package, and a manifest that does not declare the module fails
  # validation before it ever reaches a tenant.
  sql:
    - key: db
      engine: mysql

  # `function: backfill-consumer` directly, not `resolver: {function, method}`.
  # The nested-resolver form is what @forge/events v1.x wanted; v3 (the
  # version actually installed here) wants a plain function taking the raw
  # queue payload. The legacy form still deploys and lints clean — confirmed
  # live: the consumer simply never fired, and a real backfill sat at "0
  # issues indexed" forever with nothing in forge logs, since the function
  # was never invoked at all.
  consumer:
    - key: backfill-queue-consumer
      queue: backfill
      function: backfill-consumer

resources:
  - key: main
    path: src/frontend/index.tsx
  - key: gadget
    path: src/frontend/gadget.tsx
  - key: panel
    path: src/frontend/panel.tsx
  - key: admin
    path: src/frontend/admin.tsx

app:
  runtime:
    name: nodejs22.x
  # ★ Required before this app can be listed as paid-via-Atlassian.
  #
  # Without it the Marketplace listing cannot carry a price at all, and
  # adding it later forces a fresh production deploy plus a listing
  # re-approval — the expensive time to discover it is after submission.
  # Licensing is enforced for production installations only; development
  # installs (everything this repository has ever deployed) are unaffected.
  #
  # ⚠️ UNVERIFIED on a production install, like everything licensing-shaped
  # in a repo that has never shipped one: whether the platform blocks an
  # unlicensed production install by itself or expects the app to check
  # `context.license.isActive` is exactly the kind of claim this project
  # does not assert without observing it. On the RUNBOOK submission path.
  licensing:
    enabled: true
  id: ari:cloud:ecosystem::app/05b589b7-c96b-40eb-8ded-0cc100ef851b

permissions:
  scopes:
    # Least privilege; the app never writes to Jira.
    # read:jira-work — issues, changelogs and worklogs
    # read:jira-user — display names shown on reports
    # storage:app    — Forge SQL tables and app settings
    - read:jira-work
    - read:jira-user
    - storage:app
